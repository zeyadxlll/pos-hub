version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://laptophub_user:laptophub_pass@postgres:5432/laptophub_db?schema=public
      - NEXTAUTH_SECRET=super-secret-production-key-laptophub-2026
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: laptophub_postgres
    environment:
      POSTGRES_USER: laptophub_user
      POSTGRES_PASSWORD: laptophub_pass
      POSTGRES_DB: laptophub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: laptophub_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
